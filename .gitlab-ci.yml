workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: never

# Shell-executor pipeline: the runners have Rust, protoc, Docker and buildx installed.
# Images and services are intentionally not used; Testcontainers talks to the host daemon.

stages:
  - check
  - test
  - image
  - release
  - version

variables:
  CARGO_TERM_COLOR: always
  TESTCONTAINERS_RYUK_DISABLED: "true"

fmt:
  stage: check
  script:
    - cargo fmt --all -- --check

# proto/hub.proto must stay byte-identical to the umbrella's kraken/protocol/hub.proto.
proto-sync:
  stage: check
  script:
    - |
      export GIT_ASKPASS="$CI_PROJECT_DIR/.git-askpass"
      cat > "$GIT_ASKPASS" <<'EOF'
      #!/bin/sh
      case "$1" in
        Username*) echo "$KRAKEN_UMBRELLA_DEPLOY_USER" ;;
        Password*) echo "$KRAKEN_UMBRELLA_DEPLOY_TOKEN" ;;
      esac
      EOF
      chmod +x "$GIT_ASKPASS"
      rm -rf "$CI_PROJECT_DIR/../kraken"
      git clone --depth 1 "https://${CI_SERVER_HOST}/kraken-org/kraken.git" "$CI_PROJECT_DIR/../kraken"
      KRAKEN_PROTO_SYNC_REQUIRED=true KRAKEN_PROTO_SOURCE="$CI_PROJECT_DIR/../kraken/protocol/hub.proto" bash scripts/check-proto-sync.sh

clippy:
  stage: check
  script:
    - cargo clippy --all-targets --all-features -- -D warnings

test:
  stage: test
  script:
    - cargo test --all-features

docker:
  stage: image
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - IMAGE="$HARBOR_HOST/$HARBOR_PROJECT/$CI_PROJECT_NAME"
    - echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USERNAME" --password-stdin "$HARBOR_HOST"
    - docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
    - docker push "$IMAGE:$VERSION"
    - docker push "$IMAGE:latest"

release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      PAYLOAD=$(jq -n \
        --arg name "$CI_PROJECT_NAME $CI_COMMIT_TAG" \
        --arg tag "$CI_COMMIT_TAG" \
        --arg desc "Release $VERSION. Image: $HARBOR_HOST/$HARBOR_PROJECT/$CI_PROJECT_NAME:$VERSION." \
        '{name:$name,tag_name:$tag,description:$desc}')
      curl --fail --silent --show-error \
        --request POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --header "Content-Type: application/json" \
        --data "$PAYLOAD" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"

version:
  stage: version
  resource_group: release
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    GIT_DEPTH: "0"
  before_script:
    - git fetch --tags --force
  script:
    - |
      set -euo pipefail
      if git describe --tags --exact-match >/dev/null 2>&1; then
        echo "HEAD is already tagged; nothing to do."
        exit 0
      fi
      CURRENT=$(git tag --list 'v*' --sort=-v:refname | head -1)
      if [ -z "$CURRENT" ]; then CURRENT="v0.0.0"; fi
      BUMP="${SEMVER_BUMP:-}"
      if [ -z "$BUMP" ]; then
        if [ "$CURRENT" = "v0.0.0" ]; then
          LOG=$(git log --format='%s%n%b')
        else
          LOG=$(git log "$CURRENT..HEAD" --format='%s%n%b')
        fi
        if echo "$LOG" | grep -qE 'BREAKING[ -]CHANGE|^[A-Za-z]+(\([^)]*\))?!:'; then
          BUMP=major
        elif echo "$LOG" | grep -qE '^feat(\([^)]*\))?:'; then
          BUMP=minor
        elif echo "$LOG" | grep -qE '^(fix|perf)(\([^)]*\))?:'; then
          BUMP=patch
        else
          echo "No semver-relevant commits since $CURRENT; no release."
          exit 0
        fi
      fi
      case "$BUMP" in
        major|minor|patch) ;;
        *) echo "SEMVER_BUMP must be major, minor or patch"; exit 1 ;;
      esac
      V="${CURRENT#v}"
      IFS=. read -r MAJ MIN PAT <<< "$V"
      case "$BUMP" in
        major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
        minor) MIN=$((MIN+1)); PAT=0 ;;
        patch) PAT=$((PAT+1)) ;;
      esac
      NEXT="v$MAJ.$MIN.$PAT"
      echo "Current: $CURRENT; bump: $BUMP; next: $NEXT"
      if [ "${DRY_RUN:-false}" = "true" ]; then
        echo "DRY_RUN: not tagging"
        exit 0
      fi
      git config user.name "kraken-org CI"
      git config user.email "ci@damoreira.ml"
      git tag -a "$NEXT" -m "$CI_PROJECT_NAME $NEXT"
      git push "$CI_REPOSITORY_URL" "$NEXT"
      RELEASE=$(jq -n \
        --arg name "$CI_PROJECT_NAME $NEXT" \
        --arg tag "$NEXT" \
        --arg desc "Release $NEXT." \
        '{name:$name,tag_name:$tag,description:$desc}')
      STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
        --request POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --header "Content-Type: application/json" \
        --data "$RELEASE" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases")
      case "$STATUS" in
        201|409) echo "Release $NEXT is available." ;;
        *) echo "Release API returned $STATUS"; exit 1 ;;
      esac

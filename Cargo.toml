[package]
name = "kraken-hub"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Axon-Server-like gRPC router for kraken commands and queries"
license = "Apache-2.0"
publish = false

[dependencies]
tonic = "0.14.8"
prost = "0.14.4"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1"
tower = "0.5.3"
dashmap = "6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.34.0"
opentelemetry = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33.1", features = ["grpc-tonic"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
anyhow = "1"

[build-dependencies]
tonic-build = "0.14.8"
prost-build = "0.14.4"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full", "test-util"] }

[package]
name = "kraken-hub"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Axon-Server-like gRPC router for kraken commands and queries"
license = "MIT"
publish = false

[lib]
name = "kraken_hub"

[[bin]]
name = "kraken-hub"
path = "src/main.rs"

[dependencies]
tonic = "0.14.8"
tonic-prost = "0.14.8"
tonic-health = "0.14"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
prost = "0.14.4"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.34.0"
opentelemetry = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33.1", features = ["grpc-tonic"] }
anyhow = "1"
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Dashboard assets (ui/) compiled into the binary; debug-embed makes debug builds embed too, so
# tests and `cargo run` serve exactly what the release image serves.
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
sha2 = "0.10"
subtle = "2"
toml = "0.9"
rustls-native-certs = "0.8"
hyper-util = { version = "0.1.21", features = ["tokio"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
# JWT credentials (ADR 0019): rust_crypto like kraken-messaging-rs, so the image still needs no C
# toolchain; the JWKS fetch is a small hyper HTTP/1 client over the rustls the hub already has.
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
http-body-util = "0.1"
base64 = "0.22"
x509-parser = { version = "0.18", default-features = false }
# Control and reset operation ids (ADR 0023).
uuid = { version = "1", features = ["v4"] }
# The event browser reads Kafka (ADR 0025): librdkafka built from source (cmake) as in
# kraken-messaging-rs, with zlib and zstd linked in, so the distroless runtime needs no extra
# library and records any producer compressed (gzip, snappy, lz4, zstd) can be read.
rdkafka = { version = "0.39.0", features = ["cmake-build", "libz-static", "zstd"] }

[build-dependencies]
tonic-prost-build = "0.14.8"
prost-build = "0.14.4"

[dev-dependencies]
uuid = { version = "1", features = ["v7"] }
tokio = { version = "1.54.1", features = ["full", "test-util"] }
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio", "testing"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
# Signing keys for the JWT tests are generated at test time; nothing is checked in.
rsa = "0.9"
rand = "0.8"
time = { version = "0.3", default-features = false, features = ["std"] }
# A real Kafka for the event browser's tests (as kraken-messaging-rs's tests run it).
testcontainers = "0.27"
testcontainers-modules = { version = "0.15.0", features = ["kafka"] }

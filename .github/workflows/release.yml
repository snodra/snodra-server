name: release

# CI calls this after it pushes a release tag (ci.yml, job `release`): a tag pushed with
# GITHUB_TOKEN starts no workflow by itself. Run it by hand only to publish an existing tag again;
# nobody pushes tags.
on:
  workflow_call:
    inputs:
      tag:
        description: The tag to release, for example v0.6.0
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to release again, for example v0.6.0
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: snodra/snodra-server
  TAG: ${{ inputs.tag }}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Every other job needs this one: the tag must be a release version that already exists, so a
  # mistyped tag publishes nothing and creates no tag.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      latest: ${{ steps.tag.outputs.latest }}
    steps:
      - name: the tag is vN.N.N
        run: |
          if ! [[ $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::not a release tag: '$TAG'"
            exit 1
          fi
      # The current scripts and every tag (the tag's own tree may predate scripts/).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the tag exists, and whether it is the highest
        id: tag
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "::error::the tag $TAG does not exist"
            exit 1
          fi
          highest=$(git tag --list 'v*' | scripts/last-tag.sh)
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "latest=$([ "$TAG" = "$highest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "$TAG; highest release tag: $highest"

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` moves only to the highest version: publishing an older tag again leaves it.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.check.outputs.version }}
            ${{ needs.check.outputs.latest == 'true' && format('{0}:latest', env.IMAGE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The uploads attach to an existing release, so it is created first: a missing release is what
  # made every binary job fail with "release not found".
  prepare:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          NOTES="Container image: \`$IMAGE:${TAG#v}\`
          Binaries: one archive per target below (Linux musl and gnu on amd64/arm64, macOS amd64/arm64, Windows amd64)."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "${GITHUB_REPOSITORY#*/} $TAG" --notes "$NOTES"
          else
            # --verify-tag: never create a tag here.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest="$LATEST" \
              --title "${GITHUB_REPOSITORY#*/} $TAG" --generate-notes --notes "$NOTES"
          fi

  # The same binary, without Docker: static musl builds for Linux, native builds for macOS and
  # Windows. protoc comes from the build dependency, so no runner needs a system package.
  # Each binary is built first (dry run), checked where the runner can execute it, then uploaded.
  binaries:
    needs: [check, prepare]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            runs: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            runs: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
            runs: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            runs: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: build
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          ref: refs/tags/${{ env.TAG }}
          bin: snodra-server
          target: ${{ matrix.target }}
          archive: snodra-server-$tag-$target
          include: LICENSE,README.md
          locked: true
          dry-run: true
          dry-run-intended: true
      - name: the binary reports the version
        if: matrix.runs
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          bin=target/${{ matrix.target }}/release/snodra-server
          [ -f "$bin" ] || bin=$bin.exe
          got=$("$bin" --version)
          echo "$got"
          if [ "$got" != "snodra-server $VERSION" ]; then
            echo "::error::$bin reports '$got', not snodra-server $VERSION"
            exit 1
          fi
      - name: upload
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          ref: refs/tags/${{ env.TAG }}
          bin: snodra-server
          target: ${{ matrix.target }}
          archive: snodra-server-$tag-$target
          include: LICENSE,README.md
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}

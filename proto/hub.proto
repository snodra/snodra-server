// kraken hub protocol.
//
// A service opens one bidirectional stream per instance with Hub.Connect, announces the command
// and query types it handles with a Register message, and then exchanges Request and Reply
// messages over that stream for as long as it lives. The hub keeps an in-memory registry of
// connected instances and forwards each Request to one instance that registered its type.
//
// The hub never inspects or persists payloads. Payloads are JSON documents produced by the
// kraken-messaging libraries; the JSON shape of each type is defined by the owning service's
// *-api module (JVM) or documented contract (Rust).
//
// This file lives in the umbrella repository (kraken/protocol/hub.proto) and is consumed by
// kraken-hub, kraken-messaging and kraken-messaging-rs as a git submodule.

syntax = "proto3";

package kraken.hub.v1;

option java_package = "io.damoreira.kraken.hub.v1";
option java_multiple_files = true;

// Routing and relaying of commands and queries between services.
service Hub {
  // One long-lived stream per service instance. The first client message must be a Register.
  rpc Connect(stream ClientMessage) returns (stream ServerMessage);
  // A point-in-time snapshot of connected services, instances, type ownership and in-flight
  // requests, for operators and tooling. Never contains payloads or headers.
  rpc Topology(TopologyRequest) returns (TopologyResponse);
}

// Everything a service instance can send to the hub.
message ClientMessage {
  oneof message {
    Register register = 1;
    Request request = 2;
    Reply reply = 3;
    Heartbeat heartbeat = 4;
    // Flow control (capability "flow-control"): more requests this instance can take now.
    Permits permits = 5;
    // Multi-part messages (ADR 0017). Allocated now so no later phase renumbers; the hub ignores
    // them until the phase that defines them ships: a handler's streamed parts and end (P4b,
    // capability "streaming"), credits and cancellation (P4b/P4c).
    ReplyPart part = 6;
    ReplyEnd end = 7;
    Flow flow = 8;
    Cancel cancel = 9;
    // Multi-hub HA (capability "instance-status"): what this instance sees, every 5 s. Sent only
    // to a hub whose RegisterAck lists "instance-status"; the hub keeps the latest per session.
    InstanceStatus status = 10;
    // Credential refresh (capability "credentials-refresh", P5b, ADR 0019): a new credential for
    // this session, for the same service as its Register. The hub validates it as it validates the
    // Register's and, for a JWT, moves the session's expiry; a refused refresh closes the stream in
    // enforce. Sent only to a hub whose RegisterAck lists "credentials-refresh".
    Credentials credentials = 11;
    // Processor control (capability "processor-control", P6b, ADR 0023): the answer to a
    // ServerMessage.control, matched by control_id. Sent only to a hub whose RegisterAck lists
    // "processor-control".
    ControlReply control_reply = 12;
  }
}

// Everything the hub can send to a service instance.
message ServerMessage {
  oneof message {
    // A command or query another service sent, forwarded to this instance because it registered
    // the type.
    Request request = 1;
    // The reply to a Request this instance sent earlier (matched by Reply.request_id).
    Reply reply = 2;
    // A failure the hub detected for a Request this instance sent (matched by Error.request_id).
    Error error = 3;
    // Echo of a client Heartbeat, or an unsolicited keep-alive.
    Heartbeat heartbeat = 4;
    // Protocol v2 only: answers every accepted Register of a session that declared
    // Register.protocol_version >= 2. Never sent to a v1 session (protocol_version 0).
    RegisterAck register_ack = 5;
    // Multi-part messages (ADR 0017), sent only to a session that declared the capability of the
    // request mode. Scatter-gather (capability "scatter-gather", P4a): one ReplyPart per target
    // that answered, then one ReplyEnd, for a Request with mode SCATTER_GATHER this instance
    // sent. Streaming (P4b) and subscriptions (P4c) reuse them; Flow and Cancel arrive with P4b.
    ReplyPart part = 6;
    ReplyEnd end = 7;
    Flow flow = 8;
    Cancel cancel = 9;
    // Processor control (capability "processor-control", P6b, ADR 0023): the hub asks this
    // instance to act on one of its event processors. Sent only to a session whose first Register
    // declared "processor-control"; exactly one ClientMessage.control_reply answers it.
    ControlRequest control = 10;
  }
}

// Announces what this instance handles. Must be the first message on the stream. A later
// Register on the same stream replaces the previous registration (used when handlers are added
// after startup). An empty service_name or instance_id is rejected. A type listed in both
// command_types and query_types is rejected with INVALID_ARGUMENT. A type whose kind differs from
// the kind its current owner registered is rejected with ALREADY_EXISTS.
//
// Query ownership (ADR 0017): a type in query_types is exclusive, owned by one service only; a
// type in shared_query_types may be owned by many services. Registrants must agree: a type
// registered exclusive by one registrant and shared by another is rejected with ALREADY_EXISTS
// (the later Register fails). A type listed in shared_query_types and in command_types or
// query_types of the same Register is rejected with INVALID_ARGUMENT. Commands are never shared.
//
// Version negotiation (ADR 0013): protocol_version, capabilities and client_version are read from
// the first Register of a stream only; later Registers cannot change them. A v2 session
// (protocol_version >= 2) gets a RegisterAck for every accepted Register, written before the echo
// of any Heartbeat that follows it, so a new client tells a new hub (ack first) from an old one
// (echo first, no ack). Fields initial_permits, load_factor and tags (8-10) are read from the
// first Register of a stream too. Field 11 is allocated to a later roadmap phase (contexts).
message Register {
  // Logical service name, for example "gym-notes-service". Also the Kafka consumer group name.
  string service_name = 1;
  // Unique per process, for example a UUID generated at startup. Used for consistent hashing.
  string instance_id = 2;
  // Fully qualified command type names this instance handles, for example "files.AttachFile".
  repeated string command_types = 3;
  // Fully qualified query type names this instance handles, for example "files.GetFileMetadata".
  repeated string query_types = 4;
  // 0 (unset) is protocol v1: no RegisterAck, legacy heartbeat timeout. 2 is the version this
  // file defines; 1 is never sent and reads as v1; anything above 2 is answered as 2.
  uint32 protocol_version = 5;
  // Optional protocol features this client supports; unknown names are ignored by the hub.
  // Defined: "flow-control" (Permits, Register.initial_permits, RESOURCE_EXHAUSTED),
  // "instance-status" (ClientMessage.status), "scatter-gather" (Request.mode SCATTER_GATHER,
  // ReplyPart, ReplyEnd), "credentials-refresh" (ClientMessage.credentials), "processors"
  // (InstanceStatus.processors, ADR 0022) and "processor-control" (ServerMessage.control,
  // ClientMessage.control_reply, ADR 0023).
  repeated string capabilities = 6;
  // Checked when KRAKEN_HUB_AUTH_MODE is permissive or enforce (ADR 0018). Never logged.
  Credentials credentials = 7;
  // Flow control: requests the hub may forward before the next Permits message. Honoured only
  // when the session shares the "flow-control" capability; 0 (or no flow-control) means
  // unlimited, the v1 behaviour. With permits the hub queues further requests per instance
  // (ordered by Request.priority, then age) until Permits arrive.
  uint32 initial_permits = 8;
  // Relative capacity of this instance; 0 reads as 100. Weights its share of the
  // consistent-hash ring (128 * load_factor / 100 virtual nodes, 8..1024) and its load score.
  uint32 load_factor = 9;
  // Free-form labels (for example "zone" -> "eu-1"). Unkeyed requests prefer instances whose tags
  // match more of the sender's tags.
  map<string, string> tags = 10;
  // Free text naming the client library and its version, for example "kraken-messaging/0.1.0".
  // Shown in the topology view; never used for routing decisions.
  string client_version = 12;
  // Fully qualified query type names this instance handles that many services may own (ADR
  // 0017), for example a "search.FindAnything" every service answers. A point query to such a
  // type goes to one live instance of any owner; a scatter-gather query to all of them. Plain
  // (no capability needed): a hub that predates the field ignores it, so a client relying on it
  // should check the hub's RegisterAck lists "scatter-gather".
  repeated string shared_query_types = 13;
}

// Flow control: the sender may receive `count` more forwarded requests. Clients return one permit
// per handled request, batched (16, or 50 ms after the first unsent one), and at once when the
// permits still held by the hub are down to min(16, initial_permits / 2). The hub never lets a
// session hold more than its cap, which starts at initial_permits. Ignored for sessions without
// flow control.
message Permits {
  uint32 count = 1;
  // Multi-hub HA (ADR 0016): when > 0, the hub first raises this session's cap to
  // max(cap, grant), then adds `count` (still clamped at the cap). A grant never lowers the cap
  // and is ignored for unlimited sessions (initial_permits 0 or no flow control). Clients send it
  // with the top-up that moves a departed hub's share to the surviving ones; a hub that predates
  // the field ignores it and keeps clamping at initial_permits.
  uint32 grant = 2;
}

// Multi-hub HA (ADR 0016): an instance connected to several hubs reports, on each of its
// streams, which hubs it currently holds an acknowledged stream to. Hubs never talk to each
// other; this report is how one hub's topology (and the dashboard that merges all hubs) shows
// that an instance is missing a hub. The hub keeps only the latest report per session, bounded
// (at most 64 ids of at most 128 bytes each are kept; the rest is ignored).
message InstanceStatus {
  // RegisterAck.hub_id of every hub this instance has an acknowledged stream to, this one
  // included.
  repeated string connected_hub_ids = 1;
  // Handlers of this instance running now, over all its hubs.
  uint32 handlers_in_flight = 2;
  // Event processors (capability "processors", ADR 0022): one entry per Kafka event processor
  // this instance started, as of this report. Sent only to a hub whose RegisterAck lists
  // "processors" (an older hub never gets the field). The hub keeps the latest list per session,
  // bounded: at most 32 processors, 1024 partitions and 256 event types each; longer strings are
  // cut at a UTF-8 boundary (name 64 bytes, group_id and topic 256, last_error 512, an event type
  // 256, operation_id 64); the excess is dropped, never an error to the client.
  repeated ProcessorStatus processors = 3;
}

// The state of one event processor on one instance (ADR 0022). When the hub aggregates a
// processor over its instances it shows the worst state, ranked FAILING, unknown (UNSPECIFIED or
// a value it does not know), STARTING, PAUSED, STOPPED, RUNNING.
enum ProcessorState {
  // Never sent on purpose; a value this hub does not know reads as this.
  PROCESSOR_STATE_UNSPECIFIED = 0;
  // Started, but no partition is assigned to it yet, or a rebalance is in progress.
  PROCESSOR_STARTING = 1;
  // Partitions assigned and records flowing (or none waiting).
  PROCESSOR_RUNNING = 2;
  // A record exhausted its attempts in the last 60 s, or the consumer reports an error.
  PROCESSOR_FAILING = 3;
  // Stopping or stopped (shutdown), or stopped for a reset (P6b, ADR 0023): out of the consumer
  // group while a reset operation holds the processor's lock (ProcessorStatus.operation_id set).
  PROCESSOR_STOPPED = 4;
  // Paused from the hub's control plane (P6b, ADR 0023): still in the consumer group, consuming
  // nothing. Allocated in P6a, which never sent it.
  PROCESSOR_PAUSED = 5;
}

// One event processor of one instance (ADR 0022): a Kafka consumer with its own consumer group
// on the events topic, running the handlers of one processing group. Counters are since the
// instance started; never payloads, keys or headers.
message ProcessorStatus {
  // The processor's name: "default" for the handlers without a processing group, else the
  // group name ([a-z0-9][a-z0-9-]{0,47}).
  string name = 1;
  // The Kafka consumer group: the service's group for "default", "<that group>.<name>" for a
  // named processor.
  string group_id = 2;
  // The Kafka topic the processor consumes.
  string topic = 3;
  // See ProcessorState.
  ProcessorState state = 4;
  // The partitions assigned to this instance, sorted by partition; empty while none is.
  repeated PartitionStatus partitions = 5;
  // Records whose stage 1 (the processor's event handlers) completed, handled or found to be a
  // duplicate.
  uint64 processed_total = 6;
  // Records that exhausted their attempts: parked as a dead letter, sent to the dead-letter
  // topic or skipped (mode "log").
  uint64 failed_total = 7;
  // The processor's letters in the service's dead_letters collection, over all instances,
  // sampled every 30 s; 0 when dead_letter_mode is not "collection".
  uint64 dead_letters = 8;
  // The message of the latest failure (never a payload or a stack trace), at most 512 bytes
  // (cut at a UTF-8 boundary); empty when none.
  string last_error = 9;
  // When last_error happened, epoch milliseconds; 0 when none.
  int64 last_error_at_ms = 10;
  // The event types the processor's handlers handle (stage 1), sorted; "default" also lists the
  // event types its sagas handle.
  repeated string event_types = 11;
  // Where a record goes once its attempts are exhausted: "collection" (the dead_letters
  // collection, the default), "topic" (<topic>.dlt) or "log" (logged and skipped).
  string dead_letter_mode = 12;
  // A replay range is open on this instance's partitions (P6b, ADR 0023): records below a
  // partition's replay_until are handled again.
  bool replaying = 13;
  // The reset operation holding the processor's lock (P6b, ADR 0023); empty when none.
  string operation_id = 14;
}

// One partition assigned to an event processor on one instance (ADR 0022). Offsets are Kafka
// offsets; -1 means unknown or none.
message PartitionStatus {
  // The partition number.
  int32 partition = 1;
  // The next offset this instance will process; -1 when unknown.
  int64 position = 2;
  // The consumer group's committed offset; -1 when none.
  int64 committed = 3;
  // The partition's high watermark (the offset of the next record written); -1 when unknown.
  int64 high_watermark = 4;
  // high_watermark - committed (high_watermark - position when committed is -1); -1 when
  // unknown; never negative otherwise.
  int64 lag = 5;
  // The end (exclusive) of the partition's open replay range (P6b, ADR 0023): its records below
  // this offset are a replay; 0 when the partition is not replaying.
  int64 replay_until = 6;
}

// The hub asks this instance to act on one of its event processors (capability
// "processor-control", ADR 0023). Exactly one ControlReply with the same control_id answers it;
// the hub gives up after its control timeout (10 s, reset_execute 120 s) and drops a late reply.
// An instance handles control requests off its stream's read loop, one at a time per processor,
// and logs each at INFO.
message ControlRequest {
  // Unique per request, chosen by the hub (UUID).
  string control_id = 1;
  // The processor's name ("default" included).
  string processor = 2;
  oneof action {
    ProcessorPause pause = 10;
    ProcessorResume resume = 11;
    ResetPrepare reset_prepare = 12;
    ResetExecute reset_execute = 13;
    ResetFinish reset_finish = 14;
    DeadLetterList dead_letter_list = 15;
    DeadLetterRetry dead_letter_retry = 16;
    DeadLetterRetryAll dead_letter_retry_all = 17;
    DeadLetterDiscard dead_letter_discard = 18;
  }
}

// Persist "paused" in the service's processor_control collection and stop consuming without
// leaving the consumer group. Answered with ok.
message ProcessorPause {}

// Persist "not paused" and consume again. Answered with ok.
message ProcessorResume {}

// Stop consuming (leave the consumer group) and hold the operation lock until lease_ms from now.
// Re-sent with the same operation_id to renew the lease. Answered with ok once the instance has
// left the group; LOCKED when another operation holds the lock; NOT_PREPARED for an operation
// that already ended on the instance, or a renewal whose lock is gone (a late renewal never takes
// the lock again).
message ResetPrepare {
  string operation_id = 1;
  int64 lease_ms = 2;
}

// Move the consumer group's committed offsets to the target; sent to one instance that holds
// operation_id. Answered with reset.
message ResetExecute {
  string operation_id = 1;
  ResetTarget target = 2;
}

// Release the lock and start consuming again (the operation ended, or was aborted). Answered with
// ok, also when nothing is held; NOT_PREPARED when another operation is held.
message ResetFinish {
  string operation_id = 1;
  bool aborted = 2;
}

// Where a reset moves the group's offsets. Anything but latest is a replay of the records between
// the target and the committed offsets before the reset.
message ResetTarget {
  oneof to {
    // The partitions' low watermarks.
    bool earliest = 1;
    // The partitions' high watermarks; never a replay.
    bool latest = 2;
    // The first offset at or after this time, epoch milliseconds (the high watermark where no
    // record is that late).
    int64 timestamp_ms = 3;
    // Explicit offsets; a partition not listed keeps its committed offset.
    PartitionOffsets offsets = 4;
  }
}

message PartitionOffsets {
  repeated PartitionOffset offsets = 1;
}

message PartitionOffset {
  int32 partition = 1;
  int64 offset = 2;
}

// List the processor's dead letters, oldest first, without payloads or headers.
message DeadLetterList {
  // 1..100; the hub clamps.
  uint32 limit = 1;
}

message DeadLetterRetry {
  string letter_id = 1;
}

message DeadLetterRetryAll {}

message DeadLetterDiscard {
  string letter_id = 1;
}

// The answer to a ControlRequest. The hub bounds what it keeps of it as it bounds a status (strings
// cut at a UTF-8 boundary, at most 100 letters, 1024 ranges).
message ControlReply {
  // The ControlRequest.control_id this answers.
  string control_id = 1;
  oneof result {
    // pause, resume, reset_prepare, reset_finish, dead_letter_discard (the letter existed).
    ControlOk ok = 10;
    // The instance would not or could not act. Nothing changed unless the message says what did:
    // a reset_execute refused after its reset handlers ran ends with "reset handlers ran (n), m
    // markers deleted, offsets not moved: retry the reset".
    ControlRefused refused = 11;
    // reset_execute succeeded.
    ResetOutcome reset = 12;
    // dead_letter_list.
    DeadLetterPage dead_letters = 13;
    // dead_letter_retry.
    DeadLetterRetryOutcome retry = 14;
    // dead_letter_retry_all.
    DeadLetterRetryAllOutcome retry_all = 15;
  }
}

message ControlOk {
  // Free text for the operator, at most 512 bytes.
  string detail = 1;
}

message ControlRefused {
  ControlRefusal code = 1;
  // At most 512 bytes, never a payload.
  string message = 2;
}

enum ControlRefusal {
  // A value this hub does not know reads as this.
  CONTROL_REFUSAL_UNSPECIFIED = 0;
  // No such processor on this instance. To a prepare or a finish it means "not involved".
  CONTROL_REFUSAL_UNKNOWN_PROCESSOR = 1;
  // Another operation holds the processor's lock (the message names it).
  CONTROL_REFUSAL_LOCKED = 2;
  // reset_execute or reset_finish for an operation this instance does not hold; reset_prepare
  // for an operation that ended on it, or a renewal whose lock is gone.
  CONTROL_REFUSAL_NOT_PREPARED = 3;
  // Kafka refused: the consumer group still has members (the message lists their client ids).
  CONTROL_REFUSAL_GROUP_NOT_EMPTY = 4;
  // A reset handler threw (or panicked); the message says how many ran (their effects stay) and
  // that no marker or offset changed.
  CONTROL_REFUSAL_RESET_HANDLER_FAILED = 5;
  // A bad target, a bad letter id, a dead-letter mode other than "collection", a limit out of
  // range.
  CONTROL_REFUSAL_INVALID = 6;
  // Anything else (a MongoDB or Kafka error, or "lease lost: ..." when the executor's lease was
  // lost mid-execute); the message says what.
  CONTROL_REFUSAL_FAILED = 7;
  // A retry or discard of a letter that does not exist.
  CONTROL_REFUSAL_NOT_FOUND = 8;
}

message ResetOutcome {
  // One per partition that replays; empty for "latest".
  repeated ReplayRange ranges = 1;
  uint64 markers_deleted = 2;
  // How many @ResetHandler ran.
  uint32 reset_handlers = 3;
}

// Records of `partition` with from <= offset < until are a replay.
message ReplayRange {
  int32 partition = 1;
  int64 from = 2;
  int64 until = 3;
}

message DeadLetterPage {
  // At most DeadLetterList.limit letters, oldest first.
  repeated DeadLetterSummary letters = 1;
  // Every letter of the processor.
  uint64 total = 2;
}

// One dead letter without its payload or headers (ADR 0022).
message DeadLetterSummary {
  string id = 1;
  string processor = 2;
  string topic = 3;
  int32 partition = 4;
  int64 offset = 5;
  string key = 6;
  string event_id = 7;
  string event_type = 8;
  // HANDLER_FAILED, SEQUENCED or INVALID.
  string reason = 9;
  string error_type = 10;
  // At most 512 bytes.
  string error_message = 11;
  // SEQUENCED: the id of the letter of the same key this one waits behind.
  string blocked_by = 12;
  uint32 attempts = 13;
  int64 parked_at_ms = 14;
  int64 last_attempt_at_ms = 15;
}

message DeadLetterRetryOutcome {
  // Retried, Duplicate, Failed, Blocked, NotRetriable or NotFound.
  string result = 1;
  // Failed: the error (at most 512 bytes); Blocked: the head letter's id.
  string detail = 2;
}

message DeadLetterRetryAllOutcome {
  uint64 retried = 1;
  uint64 failed = 2;
  uint64 blocked = 3;
  uint64 skipped = 4;
}

// How a client authenticates itself to the hub. Carried on Register (ADR 0018) and on
// ClientMessage.credentials: token since P5a; jwt since P5b (ADR 0019), refused with
// UNAUTHENTICATED by a hub that has no JWT issuer configured.
message Credentials {
  oneof kind {
    // Static pre-shared token.
    string token = 1;
    // Client-credentials access token (JWT) issued by Keycloak; its azp claim names the service.
    string jwt = 2;
  }
}

// The hub's answer to an accepted Register of a v2 session. Carries the values the client needs
// to align with this hub: heartbeat cadence, the eviction threshold applied to this session and
// the request timeout rules.
message RegisterAck {
  // Identifies this hub process (KRAKEN_HUB_ID, default hostname plus a random suffix).
  string hub_id = 1;
  // The negotiated protocol version: min(Register.protocol_version, hub's version), currently 2.
  uint32 protocol_version = 2;
  // Capabilities both sides support (the intersection), for example "flow-control".
  repeated string capabilities = 3;
  // How often the client should send a Heartbeat.
  uint32 heartbeat_interval_ms = 4;
  // The hub evicts this session after this long without a Heartbeat.
  uint32 heartbeat_timeout_ms = 5;
  // Timeout applied to a Request with timeout_ms == 0 and no per-type override.
  uint32 default_timeout_ms = 6;
  // Upper clamp for Request.timeout_ms on types without a per-type override.
  uint32 max_timeout_ms = 7;
  // The context this session belongs to; always "default" until contexts ship.
  string context = 8;
  // Per-type timeout overrides (type name -> ms). For these types the override replaces both the
  // default and the clamp; see Request.timeout_ms.
  map<string, uint32> type_timeouts_ms = 9;
}

// How the hub delivers a Request and its answers (ADR 0017). A sender may use a mode other than
// UNARY only if its session declared the mode's capability and the hub's RegisterAck lists it;
// otherwise the request fails with UNSUPPORTED (INVALID_REQUEST for a v1 session). Handlers
// always receive mode UNARY.
enum RequestMode {
  // One handler, one Reply or Error. The v1 behaviour.
  UNARY = 0;
  // Queries only (capability "scatter-gather", P4a): every live instance of every owner gets an
  // ordinary unary Request; the sender gets one ReplyPart per answer, in arrival order, then a
  // ReplyEnd. A command fails with INVALID_REQUEST; no live instance, with an Error NO_HANDLER.
  SCATTER_GATHER = 1;
  // Allocated to P4b (streaming queries with credits). Rejected with UNSUPPORTED until then.
  STREAMING = 2;
  // Allocated to P4c (subscription queries). Rejected with UNSUPPORTED until then.
  SUBSCRIPTION = 3;
}

// Whether a Request is a command (exactly one handler, side effects) or a query (read only).
enum RequestKind {
  REQUEST_KIND_UNSPECIFIED = 0;
  COMMAND = 1;
  QUERY = 2;
}

// A command or query. Sent by the originating instance; forwarded by the hub without changes.
message Request {
  // Unique id chosen by the sender (UUID). Replies and errors carry it back.
  string id = 1;
  RequestKind kind = 2;
  // Fully qualified type name, for example "gymnotes.LogWorkout".
  string type = 3;
  // Optional. When present, all requests with the same key for the same type go to the same
  // instance of the owning service (consistent hashing). Typically the aggregate id.
  string routing_key = 4;
  // JSON document, UTF-8. The sender's library serialises the message class to this document.
  bytes payload = 5;
  // Transport metadata. Known keys: "authorization" (Bearer JWT of the acting user),
  // "correlationId", "traceparent" (W3C trace context), "tracestate".
  map<string, string> headers = 6;
  // Per-request timeout hint in milliseconds. The hub uses it to emit TIMEOUT if no Reply
  // arrives in time. The effective timeout is, with override = the hub's per-type override for
  // `type` (RegisterAck.type_timeouts_ms):
  //   timeout_ms > 0:  min(timeout_ms, override or max_timeout_ms)
  //   timeout_ms == 0: override or default_timeout_ms (5000 ms unless configured)
  // v2 clients send 0 unless their caller chose a timeout, so per-type overrides apply.
  uint32 timeout_ms = 7;
  // UNARY (the default) or a multi-part mode; see RequestMode. For SCATTER_GATHER, timeout_ms is
  // the deadline of the whole gather: the ReplyEnd comes when every target answered or the
  // deadline passed, whichever is first.
  RequestMode mode = 8;
  // Higher first when the hub queues requests for a flow-controlled instance; equal priorities
  // keep arrival order. 0 is the default. Queued requests keep their own deadline.
  int32 priority = 9;
  // Field 10 is allocated to a later roadmap phase (contexts).
  // Streaming and subscriptions: credits the sender grants before its first Flow.
  uint32 initial_credit = 11;
  // Scatter-gather: end after this many successful parts (0 = no limit). The answers of the
  // remaining targets are dropped; the targets are not cancelled.
  uint32 max_results = 12;
}

// Success or application-level failure returned by the handling instance.
message Reply {
  // The Request.id this reply answers.
  string request_id = 1;
  oneof result {
    // JSON document, UTF-8. The sender's library deserialises it to the handler's declared
    // response type. May be an empty object for commands without a result.
    bytes payload = 2;
    // The handler threw or rejected the request. Forwarded as-is to the sender.
    Error error = 3;
  }
}

// Failure codes. The hub produces NO_HANDLER, TIMEOUT, HANDLER_DISCONNECTED, and INVALID_REQUEST
// (malformed request or duplicate in-flight id); handlers produce HANDLER_ERROR, UNAUTHENTICATED,
// PERMISSION_DENIED and INVALID_REQUEST inside a Reply. The hub never sends a code above 7 to a
// v1 session, and RESOURCE_EXHAUSTED only to a session that shares the "flow-control"
// capability.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // No connected instance has registered Request.type.
  NO_HANDLER = 1;
  // No Reply arrived within Request.timeout_ms (or the hub default).
  TIMEOUT = 2;
  // The instance the request was forwarded to closed its stream before replying.
  HANDLER_DISCONNECTED = 3;
  // The handler raised an exception. "message" carries a short description, never a stack trace.
  HANDLER_ERROR = 4;
  // The handling service required an authenticated caller and the request carried no readable
  // identity, or the forwarded JWT failed validation (expired, wrong issuer, bad signature).
  UNAUTHENTICATED = 5;
  // The payload could not be deserialised into the handler's parameter type.
  INVALID_REQUEST = 6;
  // The handling service evaluated the handler's @RequiresAuthentication expression as false for
  // an authenticated caller.
  PERMISSION_DENIED = 7;
  // The target instance cannot take the request now: its queue at the hub is full (entries, its
  // bytes, or the bytes queued over the whole hub) or its session buffer is full. The handler
  // never saw the request. Sent only to senders that share the "flow-control" capability; other
  // senders get HANDLER_ERROR "handler busy" instead.
  RESOURCE_EXHAUSTED = 8;
  // The request or the stream was cancelled (Cancel, P4b). Allocated; not produced yet.
  CANCELLED = 9;
  // The request needs a feature the sender, the hub or the target did not declare: a mode other
  // than UNARY from a v2 session that did not declare its capability, or a mode this hub does
  // not implement yet (STREAMING, SUBSCRIPTION). Never sent to a v1 session.
  UNSUPPORTED = 10;
}

message Error {
  // The Request.id this error refers to.
  string request_id = 1;
  ErrorCode code = 2;
  // Human-readable, safe to log and to surface to a developer. Not for end users.
  string message = 3;
  // Optional machine-readable details from the handler (for example a validation error list as
  // JSON). Empty for hub-generated errors.
  bytes details = 4;
}

// One answer of a multi-part request (ADR 0017). For scatter-gather, one per target that answered,
// in arrival order, with the sender's Request.id. A target's Reply{error}, a hub-side failure of
// one target (HANDLER_DISCONNECTED, RESOURCE_EXHAUSTED or HANDLER_ERROR "handler busy") is a part
// with `error` set and no payload.
message ReplyPart {
  // The sender's Request.id.
  string request_id = 1;
  // JSON document, UTF-8, as the target's Reply.payload. Empty when `error` is set.
  bytes payload = 2;
  // The target's failure; its request_id is the sender's Request.id.
  Error error = 3;
  // The service and instance that answered.
  string responder_service = 4;
  string responder_instance = 5;
  // 0, 1, 2, ... in the order the hub sent the parts of this request.
  uint64 seq = 6;
}

// The last message of a multi-part request (ADR 0017): no ReplyPart for its id follows. For
// scatter-gather: sent when every target answered, when max_results successful parts arrived, or
// at the deadline, whichever is first.
message ReplyEnd {
  // The sender's Request.id.
  string request_id = 1;
  // Set when the request failed as a whole. Unset for scatter-gather in P4a: partial answers are
  // answers, and the counts below tell what was missing.
  Error error = 2;
  // ReplyParts sent, failed ones included.
  uint32 parts = 3;
  // Of those, parts carrying an error.
  uint32 failed = 4;
  // Targets that had not answered by the deadline (no part was sent for them).
  uint32 timed_out = 5;
}

// Streaming credits (P4b): the receiver of a stream may get `credits` more parts. Allocated; the
// hub ignores it until P4b.
message Flow {
  string request_id = 1;
  uint32 credits = 2;
}

// Cancels a multi-part request (P4b, both ways). Allocated; the hub ignores it until P4b.
message Cancel {
  string request_id = 1;
  string reason = 2;
}

// Keep-alive. A v2 client sends one every RegisterAck.heartbeat_interval_ms (3 s by default) and
// is evicted after RegisterAck.heartbeat_timeout_ms (10 s by default) without one. A v1 client
// sends one every 10 seconds and is evicted after the legacy timeout (30 s by default). The stream
// closing evicts at once. The hub echoes a client Heartbeat with `sent_at_ms` unchanged; clients
// use the echo to confirm a Register was processed.
message Heartbeat {
  // Sender's wall clock in milliseconds since the Unix epoch, for skew diagnostics only.
  int64 sent_at_ms = 1;
}

// Request for a topology snapshot. Carries no parameters.
message TopologyRequest {}

// One snapshot, taken at a point in time. The hub's internal maps are read one after another, so
// a service may briefly appear in one and not another; the snapshot reconciles by instance id.
message TopologyResponse {
  // Wall clock (epoch milliseconds) when this hub process started.
  int64 hub_started_at_ms = 1;
  // Wall clock (epoch milliseconds) at snapshot time.
  int64 now_ms = 2;
  // The hub's heartbeat eviction threshold for v2 sessions in milliseconds (v1 sessions use the
  // legacy threshold).
  int64 heartbeat_timeout_ms = 3;
  repeated ServiceTopology services = 4;
  // Sorted by type name.
  repeated TypeOwnership types = 5;
  TopologyTotals totals = 6;
  // Same value as RegisterAck.hub_id.
  string hub_id = 7;
}

message ServiceTopology {
  string service_name = 1;
  // Sorted by instance_id.
  repeated InstanceTopology instances = 2;
}

message InstanceTopology {
  string instance_id = 1;
  // Wall clock (epoch milliseconds) when the stream registered.
  int64 connected_since_ms = 2;
  // now_ms minus the last heartbeat (or the registration time if none yet).
  int64 last_heartbeat_age_ms = 3;
  // True when the last heartbeat is older than a third of this session's eviction threshold.
  bool stale = 4;
  // Pending requests forwarded to this instance (each scatter-gather target included).
  uint32 in_flight_as_handler = 5;
  // Pending requests this instance sent (a scatter-gather counts once).
  uint32 in_flight_as_sender = 6;
  // Sorted.
  repeated string command_types = 7;
  // Sorted.
  repeated string query_types = 8;
  // Register.protocol_version of the session's first Register (0 = v1).
  uint32 protocol_version = 9;
  // Register.client_version, empty when the client did not send one.
  string client_version = 10;
  // Requests the hub may still forward before the next Permits (0 when not flow-controlled).
  uint32 permits_available = 11;
  // Requests waiting in the hub's queue for this instance.
  uint32 queued = 12;
  // Register.load_factor as applied (0 reads as 100).
  uint32 load_factor = 13;
  // Register.tags.
  map<string, string> tags = 14;
  // True when the hub forwards to this instance only with permits.
  bool flow_controlled = 15;
  // InstanceStatus.connected_hub_ids as last reported; empty when never reported.
  repeated string connected_hub_ids = 16;
  // now_ms minus the time of the last InstanceStatus; -1 when never reported.
  int64 status_age_ms = 17;
  // Sorted; the query types of query_types this instance registered as shared (ADR 0017).
  repeated string shared_query_types = 18;
  // InstanceStatus.processors of the latest report, as the hub keeps them (bounded, ADR 0022);
  // empty when never reported or the session did not negotiate "processors".
  repeated ProcessorStatus processors = 19;
}

message TypeOwnership {
  string type = 1;
  // Reuses RequestKind (COMMAND or QUERY).
  RequestKind kind = 2;
  // The owner; for a shared query type, the first of owner_services.
  string owner_service = 3;
  // Instances currently listing the type (over all owners of a shared type).
  uint32 live_instances = 4;
  // No live instance; stays until the owner grace sweep removes the type.
  bool orphaned = 5;
  // 0 unless orphaned.
  int64 orphaned_for_ms = 6;
  // Registered through Register.shared_query_types: many services may own it (ADR 0017).
  bool shared = 7;
  // Every owning service, sorted (one entry for an exclusive type).
  repeated string owner_services = 8;
}

message TopologyTotals {
  uint32 services = 1;
  uint32 instances = 2;
  uint32 command_types = 3;
  uint32 query_types = 4;
  // Requests awaiting their terminal message (queued requests included). A scatter-gather counts
  // once, not per target.
  uint32 in_flight = 5;
  // Requests waiting in per-instance queues, all instances.
  uint32 queued = 6;
}
